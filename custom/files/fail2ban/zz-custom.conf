# Installed by custom/setup.d/50-fail2ban-postfix-sasl.sh.
# Overrides /etc/fail2ban/jail.d/mailinabox.conf (regenerated by upstream on
# updates): jail.d files are read in lexical order, so keep the "zz-" prefix.

[postfix-sasl]
# SMTP AUTH brute force on 587/465 is distributed: thousands of IPs, each
# trying only a few passwords a day. The default window (5 failures in
# 10 minutes) never triggers; count failures over a day instead.
findtime = 1d
maxretry = 3
bantime  = 1d
