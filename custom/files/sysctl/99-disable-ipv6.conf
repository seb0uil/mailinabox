# Installed by custom/setup.d/10-disable-ipv6.sh -- edit it in the repository.
# Disable IPv6 on the network interfaces. Loopback keeps it, since some
# services (nginx, dovecot) listen on [::].
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0
