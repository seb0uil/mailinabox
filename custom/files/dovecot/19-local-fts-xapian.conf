# Full-text search with Xapian.
# Installed by custom/setup.d/50-dovecot-fts-xapian.sh -- edit it in the repository.
#
# Loaded after 10-mail.conf (which adds quota) and before 20-*.conf, so the
# protocol blocks (imap, lmtp, pop3) inherit these plugins via $mail_plugins.
mail_plugins = $mail_plugins fts fts_xapian

plugin {
  fts = xapian
  fts_xapian = partial=3 verbose=0 lowmemory=500
  fts_autoindex = yes
  fts_autoindex_max_recent_msgs = 999
  fts_autoindex_exclude = \Junk
  fts_autoindex_exclude2 = \Trash
  fts_enforced = body
}

service indexer-worker {
  vsz_limit = 2G
  process_limit = 0
}
